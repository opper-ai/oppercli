name: Go Tests and Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Run tests
        run: make test-all

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.html

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Build
        run: |
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -o ./bin/opper-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/opper
          cd ./bin && sha256sum opper-${{ matrix.goos }}-${{ matrix.goarch }} > opper-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
        shell: bash

      - name: Upload binary to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ./bin/opper-${{ matrix.goos }}-${{ matrix.goarch }}
            ./bin/opper-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
